<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <script src="index.js" defer></script>
</head>
<body>
    <header class="title__container">
        <h1 class="title">NoteKeeper</h1>
    </header>
    <main class="main__container">
    <section class="form__container card__container">
        <h2>New Note Form</h2>
        <form method="post" action="">
            <label>
                Title
                <input type="text" id="title" name="title" required aria-describedby="This is the name"/>
            </label>
            <label>
                Content
                <input type="text" id="content" name="content" required aria-describedby="This is the email"/>
            </label>
            <label>
                Priority
                <select name="priority" id="priority" aria-describedby="This is the priority">
                    <option value="select" disabled selected>Select Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </label>
            <button type="submit" id="button-submit" aria-describedby="This is the button submit">Add Note</button>
        </form>
    </section>
    <section class="collectNotes">
        <h2>Notes List</h2>
    </section>
</body>
</html>
